<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>防伪标查询系统</title>
  <style>
    :root {
      --bg: #FAF7F2;
      --bg2: #F5F0E8;
      --panel: #FFFFFF;
      --ink: #2D2D2D;
      --muted: #8A8A8A;
      --rule: #E8E4DE;
      --accent: #E85D4E;
      --accent2: #F4A261;
      --accent-dark: #D04438;
      --accent-soft: rgba(232, 93, 78, 0.10);
      --warning: #E8A838;
      --danger: #D04438;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      --shadow-soft: 0 2px 12px rgba(0, 0, 0, 0.04);
      --radius: 16px;
      --radius-sm: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 56px 20px 28px;
    }
    .header { text-align: center; margin-bottom: 34px; }
    h1 { font-size: 28px; font-weight: 650; margin-bottom: 10px; }
    .subtitle { font-size: 14px; color: var(--muted); }
    .search-box { display: flex; gap: 10px; margin-bottom: 24px; }
    input {
      flex: 1;
      height: 52px;
      border: 2px solid var(--rule);
      border-radius: var(--radius-sm);
      padding: 0 18px;
      font-size: 16px;
      outline: none;
      background: var(--panel);
    }
    input:focus { border-color: var(--accent); }
    button {
      height: 52px;
      border: 0;
      border-radius: var(--radius-sm);
      padding: 0 26px;
      font-size: 16px;
      font-weight: 550;
      cursor: pointer;
    }
    .search-btn { background: var(--accent); color: white; box-shadow: 0 2px 8px rgba(232, 93, 78, .20); }
    .clear-btn { background: var(--panel); color: var(--muted); border: 2px solid var(--rule); }
    .search-btn:hover { background: var(--accent-dark); }
    .stats { text-align: center; color: var(--muted); font-size: 12px; margin-bottom: 18px; }
    .result-code, .card {
      background: var(--panel);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-soft);
      margin-bottom: 14px;
    }
    .result-code { padding: 15px 22px; color: var(--muted); font-size: 14px; }
    .result-code span { color: var(--ink); font-weight: 600; }
    .card {
      padding: 24px 22px;
      border-left: 4px solid var(--accent);
    }
    .card.pending { border-left-color: var(--warning); }
    .card.lost { border-left-color: var(--danger); }
    .card.after { border-left-color: var(--accent2); }
    .label { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .value { font-size: 20px; font-weight: 650; margin-bottom: 16px; }
    .value:last-child { margin-bottom: 0; }
    .month { color: var(--accent); }
    .pending-text { color: var(--warning); }
    .lost-text { color: var(--danger); }
    .after-text { color: var(--accent2); }
    .no-result { text-align: center; padding: 44px 20px; color: var(--muted); }
    .hint { font-size: 13px; color: var(--muted); margin-top: 8px; }
    .fuzzy-title { color: var(--muted); font-size: 13px; margin: 0 0 10px 4px; }
    .fuzzy-item {
      background: var(--panel);
      border-radius: var(--radius-sm);
      padding: 14px 18px;
      margin-bottom: 8px;
      box-shadow: var(--shadow-soft);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      gap: 16px;
    }
    .fuzzy-item:hover { background: var(--accent-soft); }
    .fuzzy-code { font-weight: 600; }
    .fuzzy-info { color: var(--muted); font-size: 13px; text-align: right; }
    .upload-zone {
      margin-bottom: 18px;
      padding: 24px 18px;
      border: 2px dashed var(--rule);
      border-radius: var(--radius);
      background: var(--panel);
      text-align: center;
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      transition: border-color .16s ease, background .16s ease, transform .16s ease;
    }
    .upload-zone:hover,
    .upload-zone.drag-over {
      border-color: var(--accent);
      background: var(--accent-soft);
      transform: translateY(-1px);
    }
    .upload-zone strong {
      display: block;
      color: var(--accent);
      font-size: 16px;
      margin-bottom: 6px;
    }
    .upload-zone span { color: var(--muted); font-size: 13px; }
    .upload-zone input { display: none; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }
    .toolbar input,
    .toolbar select {
      height: 44px;
      border: 2px solid var(--rule);
      border-radius: var(--radius-sm);
      padding: 0 12px;
      background: var(--panel);
      color: var(--ink);
      font: inherit;
    }
    .toolbar input { min-width: 240px; flex: 1; }
    .toolbar select { min-width: 180px; }
    .mini-btn {
      height: 44px;
      background: var(--panel);
      color: var(--accent);
      border: 2px solid var(--rule);
      box-shadow: none;
    }
    .mini-btn:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .danger-btn {
      color: var(--danger);
    }
    .message {
      display: none;
      margin: -4px 0 16px;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      background: var(--accent-soft);
      color: var(--accent-dark);
      font-size: 13px;
      font-weight: 650;
    }
    .data-table-wrap {
      display: none;
      margin-top: 14px;
      background: var(--panel);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-soft);
      overflow: auto;
      max-height: 360px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 720px;
      font-size: 13px;
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--rule);
      text-align: left;
      white-space: nowrap;
    }
    th {
      position: sticky;
      top: 0;
      background: var(--bg2);
      color: var(--ink);
      z-index: 1;
    }
    .footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 34px; }
    @media (max-width: 520px) {
      .container { padding-top: 38px; }
      .search-box { flex-direction: column; }
      button { width: 100%; }
      .fuzzy-item { flex-direction: column; gap: 6px; }
      .fuzzy-info { text-align: left; }
      .toolbar { flex-direction: column; }
      .toolbar input, .toolbar select { width: 100%; min-width: 0; }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="header">
      <h1>防伪标查询系统</h1>
      <p class="subtitle">输入卷芯码 / 防伪标编号，查询出货或报备状态</p>
    </section>
    <section id="uploadZone" class="upload-zone">
      <input id="excelInput" type="file" accept=".xlsx,.xls">
      <strong>拖拽防伪标数据表到此处，或点击选择文件</strong>
      <span>支持 Excel .xlsx / .xls，自动识别工厂名称、防伪标号码、出货时间、品名、固特异型号</span>
    </section>
    <div id="message" class="message"></div>
    <section class="search-box">
      <input id="searchInput" placeholder="请输入编号，如 GYA80743632" autocomplete="off" autofocus>
      <button class="search-btn" onclick="doSearch()">查询</button>
      <button id="clearBtn" class="clear-btn" onclick="clearAll()" style="display:none;">清除</button>
    </section>
    <section class="toolbar">
      <select id="factoryFilter">
        <option value="">全部工厂</option>
      </select>
      <button class="mini-btn" type="button" onclick="renderAllData()">查看全部防伪标数据</button>
      <button class="mini-btn" type="button" onclick="exportLocalData()">导出 Excel 备份</button>
      <button class="mini-btn danger-btn" type="button" onclick="clearLocalData()">清空本地数据</button>
    </section>
    <div id="stats" class="stats"></div>
    <section id="results"></section>
    <section id="dataTableWrap" class="data-table-wrap"></section>
    <div class="footer">数据来源：和和 / 卡皮诺 / 纳尔 / 纳科达 / 运研</div>
  </main>
  <script src="./xlsx.full.min.js"></script>

    function findExact(query) {
      if (DATA[query]) return [query, DATA[query]];
      var lower = query.toLowerCase();
      for (var key in DATA) {
        if (key.toLowerCase() === lower) return [key, DATA[key]];
      }
      return null;

    function doSearch() {
      var query = input.value.trim();
      if (!query) {
        results.innerHTML = '';
        clearBtn.style.display = 'none';
        return;
      }
      clearBtn.style.display = '';

      var exact = findExact(query);
      if (exact) {
        renderResult(exact[0], exact[1]);
        return;
      }

      var list = [];
      var lower = query.toLowerCase();
      for (var key in DATA) {
        if (key.toLowerCase().indexOf(lower) !== -1) {
          list.push(key);
          if (list.length >= 20) break;
        }
      }
      list.length ? renderFuzzy(list) : renderNoResult();

          statusHtml = '<div class="label">处理状态</div><div class="value"><span class="pending-text">待更新</span></div>';

        return [];
      }
    }

    function saveLocalData(rows) {
      localStorage.setItem(LOCAL_KEY, JSON.stringify(rows || []));
    }

    function showMessage(text) {
      messageBox.textContent = text;
      messageBox.style.display = text ? 'block' : 'none';
    }

    function normalizeHeader(text) {
      return String(text || '').replace(/\s+/g, '').replace(/[：:\/\\\-_（）()【】\[\].。]/g, '').toLowerCase();
    }

    function matchHeader(header, words) {
      var normalized = normalizeHeader(header);
      return words.some(function (word) {
        return normalized.indexOf(normalizeHeader(word)) >= 0;
      });
    }

    function detectColumns(headerRow) {
      var fields = {
        factory: ['工厂名称', '工厂名字', '工厂名', '工厂', '厂家', '供应商', '供应商名称'],
        code: ['防伪标号码', '防伪标号', '防伪码', '防伪号码', '防伪编号', '防伪标编号', '卷芯码', '标码'],
        shipDate: ['出货时间', '出库时间', '发货时间', '出货日期', '出库日期', '发货日期', '日期'],
        product: ['品名', '产品名称', '货品名称', '商品名称', '产品', '货品'],
        gyModel: ['固特异型号', 'GY号', 'GY型号', '固特异', 'GY', '固特异号']
      };
      var indexes = {};
      headerRow.forEach(function (cell, index) {
        Object.keys(fields).forEach(function (key) {
          if (indexes[key] == null && matchHeader(cell, fields[key])) indexes[key] = index;
        });
      });
      return indexes;
    }

    function findHeaderRow(rows) {
      for (var i = 0; i < Math.min(rows.length, 30); i++) {
        var indexes = detectColumns(rows[i] || []);
        var score = ['factory', 'code', 'shipDate', 'product', 'gyModel'].filter(function (key) { return indexes[key] != null; }).length;
        if (score >= 2 && indexes.code != null) return { rowIndex: i, indexes: indexes };
      }
      return null;
    }

    function readCell(row, index) {
      if (index == null) return '';
      return String((row || [])[index] == null ? '' : (row || [])[index]).trim();
    }

    function parseExcelWorkbook(workbook, fileName) {
      var imported = [];
      workbook.SheetNames.forEach(function (sheetName) {
        var sheet = workbook.Sheets[sheetName];
        var rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });
        var header = findHeaderRow(rows);
        if (!header) return;
        for (var i = header.rowIndex + 1; i < rows.length; i++) {
          var row = rows[i] || [];
          var code = readCell(row, header.indexes.code);
          if (!code) continue;
          imported.push({
            factory: readCell(row, header.indexes.factory),
            code: code,
            shipDate: readCell(row, header.indexes.shipDate),
            product: readCell(row, header.indexes.product),
            gyModel: readCell(row, header.indexes.gyModel),
            source: fileName || sheetName,
            importedAt: new Date().toISOString()
          });
        }
      });
      return imported;

    function handleExcelFile(file) {
      if (!file) return;
      if (!/\.(xlsx|xls)$/i.test(file.name)) {
        showMessage('请上传 Excel 文件（.xlsx / .xls）。');
        return;
      }
      if (!window.XLSX) {
        showMessage('Excel 解析库未加载，请确认 xlsx.full.min.js 与页面在同一目录。');
        return;

      var reader = new FileReader();

        try {
          var data = new Uint8Array(event.target.result);

          if (!imported.length) {
            showMessage('未识别到有效数据，请确认表格包含工厂名称、防伪标号码、出货时间、品名等字段。');
            return;
          }
          var local = getLocalData();
          saveLocalData(local.concat(imported));
          showMessage('上传完成，本次导入 ' + imported.length + ' 条数据；当前本地库共 ' + getLocalData().length + ' 条。');
          excelInput.value = '';
          refreshStats();
          refreshFactoryFilter();
          renderAllData(false);
        } catch (err) {
          showMessage('导入失败：' + (err && err.message ? err.message : '无法读取该 Excel 文件'));

      };
      reader.readAsArrayBuffer(file);
    }

      var lower = query.toLowerCase();
      var matches = filteredRecords().filter(function (row) {
        return String(row.code || '').toLowerCase().indexOf(lower) >= 0;
      });

      if (!matches.length) {
        renderNoResult();
        return;
      }
      var exact = matches.filter(function (row) {
        return String(row.code || '').toLowerCase() === lower;
      });
      renderRecordCards(exact.length ? exact : matches.slice(0, 50), exact.length ? '查询编号' : '模糊匹配');
    }

    function renderRecordCards(rows, title) {
      var html = '<div class="result-code">' + esc(title) + '：<span>' + esc(input.value.trim() || factoryFilter.value || '全部') + '</span>，共 ' + rows.length + ' 条</div>';
      rows.forEach(function (row) {
        html += '<div class="card">' +
          '<div class="label">工厂名称</div><div class="value">' + esc(row.factory || '未填写') + '</div>' +
          '<div class="label">防伪标号码</div><div class="value">' + esc(row.code || '') + '</div>' +
          '<div class="label">出货时间</div><div class="value"><span class="month">' + esc(row.shipDate || '未填写') + '</span></div>' +
          '<div class="label">品名</div><div class="value">' + esc(row.product || '未填写') + '</div>' +
          '<div class="label">固特异型号</div><div class="value">' + esc(row.gyModel || '未填写') + '</div>' +
          '</div>';
      });
      results.innerHTML = html;
    }

    function renderTable(rows, title) {
      results.innerHTML = '';
      dataTableWrap.style.display = 'block';
      var html = '<table><thead><tr><th colspan="6">' + esc(title || '全部防伪标数据') + '：共 ' + rows.length + ' 条</th></tr>' +
        '<tr><th>工厂名称</th><th>防伪标号码</th><th>出货时间</th><th>品名</th><th>固特异型号</th><th>数据来源</th></tr></thead><tbody>';
      if (!rows.length) {
        html += '<tr><td colspan="6">暂无数据</td></tr>';
      } else {
        rows.forEach(function (row) {
          html += '<tr><td>' + esc(row.factory || '') + '</td><td>' + esc(row.code || '') + '</td><td>' + esc(row.shipDate || '') + '</td><td>' + esc(row.product || '') + '</td><td>' + esc(row.gyModel || '') + '</td><td>' + esc(row.source || '本地上传') + '</td></tr>';
        });
      }
      html += '</tbody></table>';
      dataTableWrap.innerHTML = html;
    }

    function renderAllData(showAll) {
      var rows = filteredRecords();
      renderTable(rows, factoryFilter.value ? '工厂筛选：' + factoryFilter.value : '全部防伪标数据');
      if (showAll !== false) showMessage('已显示全部防伪标数据列表。');
    }

    function clearLocalData() {
      if (!confirm('确定要清空全部本地上传的防伪标数据吗？内置数据不会被删除。')) return;
      saveLocalData([]);
      showMessage('已清空本地上传数据，内置防伪标数据已保留。');
      refreshStats();
      refreshFactoryFilter();
      results.innerHTML = '';
      dataTableWrap.style.display = 'none';
    }

    function exportLocalData() {
      if (!window.XLSX) {
        showMessage('Excel 导出库未加载，暂时无法导出。');
        return;
      }
      var rows = filteredRecords().map(function (row) {
        return {
          '工厂名称': row.factory || '',
          '防伪标号码': row.code || '',
          '出货时间': row.shipDate || '',
          '品名': row.product || '',
          '固特异型号': row.gyModel || '',
          '数据来源': row.source || '本地上传'
        };
      });
      if (!rows.length) {
        showMessage('暂无可导出的防伪标数据。');
        return;
      }
      var worksheet = XLSX.utils.json_to_sheet(rows);
      var workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, '防伪标数据');
      XLSX.writeFile(workbook, '防伪标数据备份.xlsx');
      showMessage('已导出 ' + rows.length + ' 条防伪标数据。');
    }

    function clearAll() {
      input.value = '';
      results.innerHTML = '';
      dataTableWrap.style.display = 'none';
      clearBtn.style.display = 'none';
      input.focus();
    }

    uploadZone.addEventListener('click', function () {
      excelInput.click();
    });
    uploadZone.addEventListener('dragover', function (event) {
      event.preventDefault();
      uploadZone.classList.add('drag-over');
    });
    uploadZone.addEventListener('dragleave', function () {
      uploadZone.classList.remove('drag-over');
    });
    uploadZone.addEventListener('drop', function (event) {
      event.preventDefault();
      uploadZone.classList.remove('drag-over');
      handleExcelFile(event.dataTransfer.files && event.dataTransfer.files[0]);
    });
    excelInput.addEventListener('change', function () {
      handleExcelFile(excelInput.files && excelInput.files[0]);
    });
    factoryFilter.addEventListener('change', function () {
      if (input.value.trim()) doSearch();
      else if (factoryFilter.value) renderAllData(false);
    });
    window.addEventListener('storage', function (event) {
      if (event.key !== LOCAL_KEY) return;
      refreshStats();
      refreshFactoryFilter();
      if (dataTableWrap.style.display === 'block') renderAllData(false);
      if (input.value.trim()) doSearch();
    });

    refreshStats();
    refreshFactoryFilter();
  </script>
</body>
</html>
