<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>防伪标查询系统</title>
  <script src="./xlsx.full.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F0F4F1;
      --panel: #FFFFFF;
      --ink: #1A1A1A;
      --ink3: #6B7280;
      --muted: #9CA3AF;
      --muted2: #6B7280;
      --rule: #E5E7EB;
      --rule-light: #E8E4DE;
      --accent: #2A9D8F;
      --accent-dark: #238B7E;
      --accent-soft: rgba(42, 157, 143, 0.10);
      --loss: #9B8AF4;
      --loss-soft: rgba(155, 138, 244, 0.10);
      --loss-border: rgba(155, 138, 244, 0.30);
      --warning: #E8A838;
      --warning-soft: rgba(232, 168, 56, 0.12);
      --danger: #D04438;
      --danger-soft: rgba(208, 68, 56, 0.10);
      --accent2: #F4A261;
      --accent2-soft: rgba(244, 162, 97, 0.12);
      --shadow-card: 0 4px 20px rgba(42, 157, 143, 0.06);
      --shadow-soft: 0 2px 12px rgba(0, 0, 0, 0.04);
      --radius: 16px;
      --radius-sm: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Instrument Sans', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 56px 20px 28px;
    }
    .header { text-align: center; margin-bottom: 30px; }
    h1 { font-size: 26px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: var(--muted2); }

    /* 【防伪标迭代新增】导出按钮区域 */
    .action-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
    }
    .action-bar button {
      height: 44px;
      border: 0;
      border-radius: 999px;
      padding: 0 22px;
      font-size: 14px;
      font-weight: 550;
      cursor: pointer;
      transition: background .15s ease, transform .1s ease;
    }
    .action-bar button:active { transform: scale(0.97); }
    .export-btn { background: var(--accent); color: #fff; }
    .export-btn:hover { background: var(--accent-dark); }
    .update-btn { background: var(--accent); color: #fff; border: 1px solid var(--accent); }
    .update-btn:hover { background: var(--accent-dark); border-color: var(--accent-dark); color: #fff; }
    .hidden-file-input { display: none; }

    /* 【防伪标迭代新增】极简单输入框搜索 */
    .search-box { display: flex; gap: 12px; margin-bottom: 16px; }
    .search-box input {
      flex: 1; height: 48px; border: 1px solid var(--rule);
      border-radius: 999px; padding: 0 16px;
      font-size: 15px; outline: none; background: var(--panel); color: var(--ink);
    }
    .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .search-box input::placeholder { color: #B0B8C4; }
    .search-box button {
      height: 48px; border: 0; border-radius: 999px;
      padding: 0 28px; font-size: 15px; font-weight: 550; cursor: pointer;
      transition: background .15s ease;
    }
    .search-box button:active { transform: scale(0.97); }
    .search-btn { background: var(--accent); color: #fff; }
    .search-btn:hover { background: var(--accent-dark); }
    .clear-btn { background: var(--accent); color: #fff; border: 1px solid var(--accent); }
    .clear-btn:hover { background: var(--accent-dark); border-color: var(--accent-dark); color: #fff; }

    .stats { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 24px; }

    /* 【防伪标迭代新增】消息提示 */
    .message {
      display: none; margin-bottom: 16px; padding: 12px 16px;
      border-radius: 999px; font-size: 13px; font-weight: 550;
    }
    .message.ok { background: rgba(34, 197, 94, 0.10); color: #16A34A; }
    .message.bad { background: var(--danger-soft); color: var(--danger); }
    .message.info { background: var(--accent-soft); color: var(--accent); }

    /* 【防伪标迭代新增】查询编号标题栏 */
    .result-code {
      background: var(--panel); border-radius: 999px;
      box-shadow: var(--shadow-soft); padding: 16px 24px;
      margin-bottom: 16px; font-size: 14px; color: var(--muted);
    }
    .result-code span { color: var(--ink); font-weight: 700; font-size: 15px; }

    /* 【防伪标迭代新增】结果详情卡片：蓝色左边框 + 纵向字段堆叠 */
    .card {
      background: var(--panel); border-radius: var(--radius);
      box-shadow: var(--shadow-card); padding: 28px 28px;
      border-left: 4px solid var(--accent); margin-bottom: 16px;
    }
    .card.loss { border-left-color: var(--loss); }
    .card.pending { border-left-color: var(--warning); }
    .card.lost { border-left-color: var(--danger); }
    .card.after { border-left-color: var(--accent2); }
    .field-block { margin-bottom: 20px; }
    .field-block:last-child { margin-bottom: 0; }
    .field-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .field-value { font-size: 16px; font-weight: 600; color: var(--ink3); }
    .field-value.factory { font-size: 22px; font-weight: 700; color: var(--ink); }
    .field-value.ship-date { color: var(--accent); font-size: 17px; font-weight: 650; }

    /* 状态标签 */
    .status-tag {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 14px; border-radius: 20px; font-size: 13px; font-weight: 650;
    }
    .status-tag.shipped { background: var(--accent-soft); color: var(--accent); }
    .status-tag.pending { background: var(--warning-soft); color: var(--warning); }
    .status-tag.lost { background: var(--danger-soft); color: var(--danger); }
    .status-tag.after { background: var(--accent2-soft); color: var(--accent2); }
    /* 【防伪标迭代新增】损耗已报备：紫色醒目标签 */
    .status-tag.loss { background: var(--loss-soft); color: var(--loss); border: 1.5px solid var(--loss-border); font-weight: 700; }

    .no-result { text-align: center; padding: 48px 20px; color: var(--muted); font-size: 15px; }
    .no-result .hint { font-size: 13px; margin-top: 8px; color: var(--muted); }

    /* 【防伪标迭代新增】底部统计栏 */
    .bottom-stats {
      display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
      margin-top: 32px; padding: 16px 20px;
      background: var(--panel); border-radius: 999px; box-shadow: var(--shadow-soft);
    }
    .stat-item { font-size: 13px; color: var(--muted2); }
    .stat-item strong { font-size: 16px; font-weight: 700; margin: 0 3px; }
    .stat-item.total strong { color: var(--ink); }
    .stat-item.shipped strong { color: var(--accent); }
    .stat-item.pending strong { color: var(--warning); }
    .stat-item.loss strong { color: var(--loss); }
    .stat-divider { width: 1px; height: 20px; background: var(--rule-light); align-self: center; }

    .footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 28px; }

    @media (max-width: 520px) {
      .container { padding-top: 38px; }
      .search-box { flex-direction: column; }
      .search-box button { width: 100%; }
      .card { padding: 20px 18px; }
      .field-value.factory { font-size: 19px; }
      .bottom-stats { flex-direction: column; gap: 6px; }
      .stat-divider { display: none; }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="header">
      <h1>防伪标查询系统</h1>
      <p class="subtitle">输入防伪标编号，查询出货或报备状态</p>
    </section>

    <!-- 【防伪标迭代新增】导出 + 数据更新按钮（替换原拖拽上传区） -->
    <div class="action-bar">
      <button class="export-btn" type="button" onclick="exportData()">一键导出 Excel</button>
      <button class="update-btn" type="button" onclick="document.getElementById('updateFileInput').click()">更新数据（读取模板）</button>
      <input type="file" id="updateFileInput" class="hidden-file-input" accept=".xlsx,.xls">
    </div>

    <div id="message" class="message"></div>

    <!-- 【防伪标迭代新增】极简单输入框搜索 -->
    <section class="search-box">
      <input id="searchInput" type="text" placeholder="请输入防伪标编号，如 A11398118" autocomplete="off">
      <button class="search-btn" type="button" onclick="doSearch()">查询</button>
      <button class="clear-btn" type="button" onclick="clearSearch()">清除</button>
    </section>

    <div id="stats" class="stats"></div>
    <section id="results"></section>

    <!-- 【防伪标迭代新增】底部统计栏 -->
    <div class="bottom-stats" id="bottomStats"></div>

    <div class="footer">数据来源：运研 / 纳尔 / 纳科达 / 和和 / 卡皮诺</div>
  </main>

  <script>
    /* ========== 原始内置数据（完整保留，不删除、不修改） ========== */
    var DATA = {};

    /* ========== 【防伪标迭代新增】工具函数 ========== */
    function esc(text) {
      var div = document.createElement('div');
      div.textContent = text == null ? '' : String(text);
      return div.innerHTML;
    }

    var LOCAL_KEY = 'of_antifake_local_records_v1';
    var messageBox = document.getElementById('message');
    var searchInput = document.getElementById('searchInput');

    function showMessage(text, type) {
      messageBox.textContent = text || '';
      messageBox.className = 'message' + (type ? ' ' + type : '');
      messageBox.style.display = text ? 'block' : 'none';
    }

    /* ========== 本地存储 ========== */
    function getLocalData() {
      try {
        var data = JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]');
        return Array.isArray(data) ? data : [];
      } catch (err) { return []; }
    }
    function saveLocalData(rows) {
      localStorage.setItem(LOCAL_KEY, JSON.stringify(rows || []));
    }

    /* ========== 【防伪标迭代新增】统一数据结构转换 ========== */
    // 将原始 DATA ({code: [{f, s, d}]}) 转换为统一行格式，新增 status 字段
    function staticRecords() {
      var rows = [];
      for (var code in DATA) {
        (DATA[code] || []).forEach(function (item) {
          rows.push({
            code: code,
            factory: item.f || '',
            product: item.p || '',
            gyModel: item.gy || '',
            category: item.cat || '',
            goodyearModel: item.gm || '',
            meters: item.m || '',
            shipDate: item.s === '已出货' ? (item.d || '') : '',
            status: item.s || '未知',
            source: '内置数据'
          });
        });
      }
      return rows;
    }

    function allRecords() {
      var rows = staticRecords();
      getLocalData().forEach(function (row) { rows.push(Object.assign({}, row)); });
      return rows;
    }

    /* ========== 【防伪标迭代新增】查询逻辑（仅按防伪标编号 B列 搜索） ========== */
    function doSearch() {
      var query = searchInput.value.trim();
      var results = document.getElementById('results');
      if (!query) {
        results.innerHTML = '';
        showMessage('请输入防伪标编号。', 'info');
        return;
      }
      showMessage('');

      var lower = query.toLowerCase();
      var records = allRecords();

      var exact = records.filter(function (row) {
        return String(row.code || '').toLowerCase() === lower;
      });

      if (exact.length) {
        renderResultCard(exact[0]);
        return;
      }

      var fuzzy = records.filter(function (row) {
        return String(row.code || '').toLowerCase().indexOf(lower) >= 0;
      });

      if (fuzzy.length) {
        renderFuzzyList(fuzzy.slice(0, 10));
        return;
      }

      results.innerHTML = '<div class="no-result"><p>未查询到该防伪标编号</p><p class="hint">请检查编号是否正确，或联系相关人员确认</p></div>';
    }

    /* ========== 【防伪标迭代新增】结果卡片渲染（纵向堆叠 + 状态着色） ========== */
    function renderResultCard(row) {
      var statusText = row.status || '未知';
      var cardCls = 'card';
      var statusCls = 'shipped';

      if (statusText === '已出货') { cardCls = 'card'; statusCls = 'shipped'; }
      else if (statusText === '待更新') { cardCls = 'card pending'; statusCls = 'pending'; }
      else if (statusText === '丢失已报备') { cardCls = 'card lost'; statusCls = 'lost'; }
      else if (statusText === '售后已报备') { cardCls = 'card after'; statusCls = 'after'; }
      else if (statusText === '损耗已报备') { cardCls = 'card loss'; statusCls = 'loss'; }

      var html = '<div class="result-code">查询编号：<span>' + esc(row.code || '') + '</span></div>';
      html += '<div class="' + cardCls + '">';
      html += '<div class="field-block"><div class="field-label">寄出工厂</div><div class="field-value factory">' + esc(row.factory || '未填写') + '</div></div>';
      html += '<div class="field-block"><div class="field-label">品名</div><div class="field-value">' + esc(row.product || '未填写') + '</div></div>';
      html += '<div class="field-block"><div class="field-label">GY 型号</div><div class="field-value">' + esc(row.gyModel || '未填写') + '</div></div>';
      html += '<div class="field-block"><div class="field-label">出货时间</div><div class="field-value ship-date">' + esc(row.shipDate || '—') + '</div></div>';
      html += '<div class="field-block"><div class="field-label">状态</div><div><span class="status-tag ' + statusCls + '">' + esc(statusText) + '</span></div></div>';
      html += '</div>';

      document.getElementById('results').innerHTML = html;
    }

    function renderFuzzyList(rows) {
      var html = '<div class="result-code">未找到完全匹配，相近结果（点击查看）：</div>';
      rows.forEach(function (row) {
        var info = row.factory + ' · ' + (row.status === '已出货' ? row.shipDate : row.status);
        html += '<div class="result-code" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;" onclick="selectCode(\'' + row.code.replace(/'/g, "\\\'") + '\')">';
        html += '<span style="color:var(--ink);font-weight:600;font-size:15px;">' + esc(row.code) + '</span>';
        html += '<span style="font-size:13px;">' + esc(info) + '</span>';
        html += '</div>';
      });
      document.getElementById('results').innerHTML = html;
    }

    function selectCode(code) {
      searchInput.value = code;
      doSearch();
    }

    function clearSearch() {
      searchInput.value = '';
      document.getElementById('results').innerHTML = '';
      searchInput.focus();
    }

    /* ========== 【防伪标迭代新增】一键导出 Excel（严格匹配模板列 A~I） ========== */
    function exportData() {
      if (!window.XLSX) { showMessage('Excel 导出库未加载。', 'bad'); return; }
      var records = allRecords();
      if (!records.length) { showMessage('暂无可导出的数据。', 'info'); return; }

      var exportRows = records.map(function (row) {
        return {
          '寄出工厂': row.factory || '',
          '防伪标': row.code || '',
          '品名': row.product || '',
          'GY型号': row.gyModel || '',
          '类别': row.category || '',
          '固特异型号': row.goodyearModel || '',
          '米数': row.meters || '',
          '出库状态': row.status || '',
          '出货时间': row.shipDate || ''
        };
      });
      var worksheet = XLSX.utils.json_to_sheet(exportRows, {
        header: ['寄出工厂', '防伪标', '品名', 'GY型号', '类别', '固特异型号', '米数', '出库状态', '出货时间']
      });
      var workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, '防伪标数据');
      var fileName = '防伪标数据导出_' + new Date().toISOString().slice(0, 10) + '.xlsx';
      XLSX.writeFile(workbook, fileName);
      showMessage('已导出 ' + exportRows.length + ' 条数据，文件：' + fileName, 'ok');
    }

    /* ========== 【防伪标迭代新增】数据更新逻辑（读取新模板） ========== */
    // 规则1: 模板标记损耗的防伪标编号，直接覆盖数据库内该编号旧记录
    // 规则2: 数据库原有状态为"待更新"的防伪标，若新模板出现相同编号，直接覆盖旧数据
    // 规则3: 不满足上面两条的历史防伪标数据完整保留
    function normalizeHeader(text) {
      return String(text || '').replace(/\s+/g, '').replace(/[：:\/\\\-_（）()【】\[\].。]/g, '').toLowerCase();
    }
    function matchHeader(header, words) {
      var n = normalizeHeader(header);
      return words.some(function (w) { return n.indexOf(normalizeHeader(w)) >= 0; });
    }
    function detectColumns(headerRow) {
      var fields = {
        factory: ['工厂名称', '工厂', '厂家', '寄出工厂'],
        code: ['防伪标号码', '防伪标号', '防伪码', '防伪编号', '防伪标', '卷芯码', '标码'],
        product: ['品名', '产品名称', '货品名称', '产品', '货品'],
        gyModel: ['GY型号', 'GY号', 'GY'],
        category: ['类别', '分类', '产品类别', '产品分类'],
        goodyearModel: ['固特异型号', '固特异', 'Goodyear'],
        meters: ['米数', '长度', '米长'],
        status: ['出库状态', '状态', '出货状态'],
        shipDate: ['出货时间', '出库时间', '发货时间', '出货日期', '日期']
      };
      var indexes = {};
      (headerRow || []).forEach(function (cell, index) {
        Object.keys(fields).forEach(function (key) {
          if (indexes[key] == null && matchHeader(cell, fields[key])) indexes[key] = index;
        });
      });
      return indexes;
    }

    document.getElementById('updateFileInput').addEventListener('change', function (e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      if (!/\.(xlsx|xls)$/i.test(file.name)) { showMessage('请上传 Excel 文件。', 'bad'); return; }

      var reader = new FileReader();
      reader.onload = function (event) {
        try {
          var data = new Uint8Array(event.target.result);
          var workbook = XLSX.read(data, { type: 'array', cellDates: true });
          var imported = [];

          workbook.SheetNames.forEach(function (sheetName) {
            var sheet = workbook.Sheets[sheetName];
            var rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });
            if (rows.length < 2) return;

            var colMap = detectColumns(rows[0]);
            if (colMap.code == null) colMap.code = 1;
            if (colMap.product == null) colMap.product = 2;
            if (colMap.gyModel == null) colMap.gyModel = 3;
            if (colMap.status == null) colMap.status = 7;
            if (colMap.shipDate == null) colMap.shipDate = 8;
            if (colMap.factory == null) colMap.factory = 0;

            for (var i = 1; i < rows.length; i++) {
              var row = rows[i] || [];
              var code = String(row[colMap.code] || '').trim();
              if (!code) continue;

              var rawStatus = String(row[colMap.status] || '').trim();
              var shipDate = String(row[colMap.shipDate] || '').trim();
              var product = String(row[colMap.product] || '').trim();
              var gyModel = String(row[colMap.gyModel] || '').trim();
              var factory = String(row[colMap.factory] || '').trim();
              var category = colMap.category != null ? String(row[colMap.category] || '').trim() : '';
              var goodyearModel = colMap.goodyearModel != null ? String(row[colMap.goodyearModel] || '').trim() : '';
              var meters = colMap.meters != null ? String(row[colMap.meters] || '').trim() : '';

              if (shipDate && /^\d+$/.test(shipDate)) {
                var dateObj = new Date(Date.UTC(1899, 11, 30) + parseInt(shipDate, 10) * 86400000);
                shipDate = dateObj.getUTCFullYear() + '-' + String(dateObj.getUTCMonth() + 1).padStart(2, '0');
              }

              var status = '已出货';
              if (rawStatus === '破损已报备' || rawStatus === '损耗已报备') {
                status = '损耗已报备';
              } else if (rawStatus === '已出库') {
                status = '已出货';
              } else if (rawStatus) {
                status = rawStatus;
              }

              if (product === '破损已报备') product = '';

              imported.push({
                code: code, factory: factory, product: product, gyModel: gyModel,
                category: category, goodyearModel: goodyearModel, meters: meters,
                shipDate: shipDate, status: status, source: '模板更新'
              });
            }
          });

          if (!imported.length) { showMessage('未识别到有效数据。', 'bad'); return; }

          var local = getLocalData();
          var updatedCount = 0, lossCount = 0;

          imported.forEach(function (newRow) {
            var isLoss = newRow.status === '损耗已报备';
            var existingIndex = -1;
            for (var i = 0; i < local.length; i++) {
              if (local[i].code === newRow.code) { existingIndex = i; break; }
            }

            if (existingIndex >= 0) {
              var existing = local[existingIndex];
              if (isLoss || existing.status === '待更新') {
                local[existingIndex] = newRow;
                updatedCount++;
                if (isLoss) lossCount++;
              } else {
                /* 已出货等记录：不覆盖状态和日期，只合并补充品名/GY型号/类别/固特异型号/米数 */
                var merged = false;
                ['product', 'gyModel', 'category', 'goodyearModel', 'meters'].forEach(function (field) {
                  if (newRow[field] && !existing[field]) {
                    existing[field] = newRow[field];
                    merged = true;
                  }
                });
                if (merged) updatedCount++;
              }
            } else {
              local.push(newRow);
              updatedCount++;
              if (isLoss) lossCount++;
            }
          });

          saveLocalData(local);
          refreshStats();

          var msg = '数据更新完成：处理 ' + imported.length + ' 条，更新 ' + updatedCount + ' 条';
          if (lossCount > 0) msg += '（损耗已报备 ' + lossCount + ' 条）';
          msg += '。历史数据已保留。';
          showMessage(msg, 'ok');

          if (searchInput.value.trim()) doSearch();
        } catch (err) {
          showMessage('导入失败：' + (err && err.message ? err.message : '无法读取文件'), 'bad');
        }
      };
      reader.readAsArrayBuffer(file);
      e.target.value = '';
    });

    /* ========== 【防伪标迭代新增】统计刷新 ========== */
    function refreshStats() {
      var records = allRecords();
      var total = records.length;
      var shipped = records.filter(function (r) { return r.status === '已出货'; }).length;
      var pending = records.filter(function (r) { return r.status === '待更新'; }).length;
      var loss = records.filter(function (r) { return r.status === '损耗已报备'; }).length;

      document.getElementById('stats').textContent = '已收录 ' + total + ' 条防伪标编码数据';

      var bs = document.getElementById('bottomStats');
      bs.innerHTML =
        '<div class="stat-item total">总计<strong>' + total + '</strong>条</div>' +
        '<div class="stat-divider"></div>' +
        '<div class="stat-item shipped">已出货<strong>' + shipped + '</strong>条</div>' +
        '<div class="stat-divider"></div>' +
        '<div class="stat-item pending">待更新<strong>' + pending + '</strong>条</div>' +
        '<div class="stat-divider"></div>' +
        '<div class="stat-item loss">损耗已报备<strong>' + loss + '</strong>条</div>';
    }

    /* ========== 初始化 ========== */
    searchInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') doSearch();
    });

    refreshStats();
  </script>
</body>
</html>
